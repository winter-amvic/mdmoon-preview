<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MD Moon — 새 웹사이트 준비 중 (Preview A)</title>
<style>
  :root { --ink:#12161c; --muted:#6b7280; --line:#e5e7eb; --accent:#8a6b3f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #f7f6f3; color: var(--ink);
    font: 16px/1.65 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: grid; place-items: center; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(640px, 100%); background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 40px 36px; box-shadow: 0 1px 2px rgba(16,24,40,.04);
  }
  .slot {
    display: inline-block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); border: 1px solid currentColor; border-radius: 999px;
    padding: 4px 10px; margin-bottom: 22px;
  }
  h1 { margin: 0 0 12px; font-size: clamp(22px, 4.2vw, 30px); line-height: 1.3; letter-spacing: -.01em; }
  p { margin: 0 0 14px; color: var(--muted); }
  p:last-child { margin-bottom: 0; }
  .rule { height: 1px; background: var(--line); margin: 26px 0; }
  .en { font-size: 14px; color: var(--muted); }
  @media (max-width: 480px) { .card { padding: 30px 22px; } }
</style>
</head>
<body>
  <main class="card">
    <span class="slot">Preview A</span>
    <h1>새 웹사이트를 준비하고 있습니다</h1>
    <p>이 주소는 MD Moon 리뉴얼 시안 <strong>A안</strong>이 들어갈 자리입니다. 시안이 완성되면 이 페이지가 새 사이트로 바뀝니다.</p>
    <div class="rule"></div>
    <p class="en">This preview slot is reserved for design option A. It will be replaced by the new website once the design is ready.</p>
  </main>
</body>
</html>
