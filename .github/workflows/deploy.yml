name: Deploy candidates (a/b/c) to UGREEN NAS

# 구조 (2026-10-27~)
#   repo a/  → NAS /volume1/docker/mdmoon.com/a/  → https://a.mdmoon.com
#   repo b/  → NAS /volume1/docker/mdmoon.com/b/  → https://b.mdmoon.com
#   repo c/  → NAS /volume1/docker/mdmoon.com/c/  → https://c.mdmoon.com
#   main(mdmoon.com) 은 이 워크플로가 건드리지 않는다 — 배포 전후 sha256 지문으로 증명한다.
#   고객이 후보 하나를 고르면 workflow_dispatch 에서 promote=a|b|c 로 승격한다.
#   (승격 직전 현재 main 을 backup/pre-promote-<시각>/ 으로 자동 백업)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: "main(mdmoon.com)으로 승격할 후보 (none 이면 후보 배포만)"
        required: true
        default: "none"
        type: choice
        options: [none, a, b, c]

permissions:
  contents: read

concurrency:
  group: nas-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NAS_BASE: /volume1/docker/mdmoon.com

jobs:
  deploy-candidates:
    name: rsync candidates → NAS a/b/c
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Guard — 경로·도구 검증 + main 지문 기록
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAS_BASE}"
          if [ -z "${BASE}" ] || [ "${BASE}" = "/" ]; then
            echo "::error::NAS_BASE 가 비었거나 루트입니다."; exit 1
          fi
          case "${BASE}" in
            /volume1/docker/mdmoon.com) ;;
            *) echo "::error::허용되지 않은 NAS_BASE: ${BASE}"; exit 1 ;;
          esac
          command -v rsync >/dev/null || { echo "::error::runner 에 rsync 없음"; exit 1; }
          mkdir -p "${BASE}/a" "${BASE}/b" "${BASE}/c"
          find "${BASE}/main" -type f -exec sha256sum {} + | sort | sha256sum > "${RUNNER_TEMP}/main.before"
          echo "main 지문(전): $(cat "${RUNNER_TEMP}/main.before")"
          echo "배포 대상: a/→a/  b/→b/  c/→c/  (main 제외)"

      - name: 검색 노출 차단 스탬프 (noindex + robots.txt)
        shell: bash
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/_scripts/stamp_previews.py" "${GITHUB_WORKSPACE}" a b c

      - name: Deploy a/b/c
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAS_BASE}"
          for c in a b c; do
            SRC="${GITHUB_WORKSPACE}/${c}"
            if [ ! -d "${SRC}" ] || [ ! -f "${SRC}/index.html" ]; then
              echo "::notice::${c}/ 에 index.html 이 없어 배포를 건너뜁니다(빈 슬롯 유지)."
              continue
            fi
            echo "--- ${c}/ → ${BASE}/${c}/"
            rsync -a --delete --delete-excluded --delay-updates --chmod=D755,F644 \
              --exclude='.gitkeep' --exclude='*.md' \
              "${SRC}/" "${BASE}/${c}/"
            find "${BASE}/${c}" -type d -exec chmod 755 {} +
            find "${BASE}/${c}" -type f -exec chmod 644 {} +
            test -f "${BASE}/${c}/index.html" || { echo "::error::${c}/index.html 없음"; exit 1; }
            du -sh "${BASE}/${c}"
          done

      - name: Verify — main 무변경 + 후보 상태
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAS_BASE}"
          find "${BASE}/main" -type f -exec sha256sum {} + | sort | sha256sum > "${RUNNER_TEMP}/main.after"
          echo "main 지문(후): $(cat "${RUNNER_TEMP}/main.after")"
          if ! diff -q "${RUNNER_TEMP}/main.before" "${RUNNER_TEMP}/main.after" >/dev/null; then
            echo "::error::main 이 변경됐습니다. 즉시 확인 필요."; exit 1
          fi
          echo "✔ main 무변경 확인"
          for d in main a b c; do
            printf '  %-5s %4s files  noindex html:%s\n' "$d" \
              "$(find "${BASE}/${d}" -type f | wc -l)" \
              "$(grep -rl 'noindex, nofollow' "${BASE}/${d}" 2>/dev/null | wc -l)"
          done

  promote-to-main:
    name: promote candidate → main
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote != 'none' }}
    needs: deploy-candidates
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Guard
        shell: bash
        run: |
          set -euo pipefail
          P="${{ inputs.promote }}"
          case "${P}" in a|b|c) ;; *) echo "::error::promote 값 오류: ${P}"; exit 1 ;; esac
          test -f "${NAS_BASE}/${P}/index.html" || { echo "::error::${P}/ 에 사이트가 없습니다"; exit 1; }
          echo "승격: ${P} → main"

      - name: 현재 main 자동 백업
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          D="${NAS_BASE}/backup/pre-promote-${TS}"
          mkdir -p "${D}/site"
          cp -a "${NAS_BASE}/main/." "${D}/site/"
          tar -czf "${D}/main-mdmoon-${TS}.tar.gz" -C "${NAS_BASE}" main
          echo "백업: ${D} ($(du -sh "${D}" | cut -f1))"

      - name: 승격 실행
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAS_BASE}"; P="${{ inputs.promote }}"
          rsync -a --delete --delete-excluded --delay-updates --chmod=D755,F644 \
            "${BASE}/${P}/" "${BASE}/main/"
          find "${BASE}/main" -type d -exec chmod 755 {} +
          find "${BASE}/main" -type f -exec chmod 644 {} +
          # 승격본은 실제 공개 사이트이므로 noindex 를 걷어낸다
          rm -f "${BASE}/main/robots.txt"
          find "${BASE}/main" -name "*.html" -exec sed -i 's|<meta name="robots" content="noindex, nofollow">||g' {} +
          test -f "${BASE}/main/index.html" || { echo "::error::main/index.html 없음"; exit 1; }
          echo "승격 완료 — 파일 $(find "${BASE}/main" -type f | wc -l)개"
          curl -s -o /dev/null -w "https://mdmoon.com/ → HTTP %{http_code}\n" --max-time 20 https://mdmoon.com/ || true
